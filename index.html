<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家庭日历">

<title>冰箱家庭日历</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: fridge board. Tablet = today panel + photo on top (80% of the screen), the next seven days in a strip (20%).
   Phone = the same blocks stacked in a normal scrolling page. ES5 + prefixed flexbox only, for iOS 9 Safari. */
:root{
  --bg:#eef2f3; --card:#ffffff; --ink:#132029; --muted:#5a6873; --line:#d5dde1;
  --accent:#1f4f86; --accent-ink:#ffffff; --today:#fff6d6; --tint:rgba(31,79,134,.10);
  --bc:#0b7563; --cn:#c2372a; --ol:#0f6cbd; --ic:#7a8791;
  --c1:#1f6fd1; --c2:#13915c; --c3:#e07a12; --c4:#7d4cc9; --c5:#d23c6f;
  --danger:#b3261e;
  --display:"Big Shoulders Display","Avenir Next Condensed","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans GB","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --card:#172026; --ink:#eef3f5; --muted:#9db0bb; --line:#2a3740;
  --accent:#8bbcf0; --accent-ink:#0e1418; --today:#2b2a1a; --tint:rgba(139,188,240,.14);
  --bc:#4fcab2; --cn:#ff7c68; --ol:#6cb8f6; --ic:#8fa0ab;
  --c1:#6aa8f5; --c2:#4cc98d; --c3:#f3a04b; --c4:#b394f0; --c5:#f27aa1; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --card:#172026; --ink:#eef3f5; --muted:#9db0bb; --line:#2a3740;
  --accent:#8bbcf0; --accent-ink:#0e1418; --today:#2b2a1a; --tint:rgba(139,188,240,.14);
  --bc:#4fcab2; --cn:#ff7c68; --ol:#6cb8f6; --ic:#8fa0ab;
  --c1:#6aa8f5; --c2:#4cc98d; --c3:#f3a04b; --c4:#b394f0; --c5:#f27aa1; --danger:#ff8a80; color-scheme:dark}

html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:#eef2f3;background:var(--bg);color:#132029;color:var(--ink);font-family:var(--body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;border-radius:10px}
button:focus,input:focus,select:focus,textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;margin:3px 0 3px 6px;font-size:1rem;line-height:1.2}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.icon{padding:8px 12px;font-weight:700}
.col1{background:var(--c1)!important}.col2{background:var(--c2)!important}.col3{background:var(--c3)!important}.col4{background:var(--c4)!important}.col5{background:var(--c5)!important}
.colicloud{background:var(--ic)!important}.coloutlook{background:var(--ol)!important}

/* ---------- home: today panel ---------- */
#home{padding:12px}
.today{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px 10px;
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-width:0}
.thead{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex:none;flex:none;
  border-bottom:2px solid var(--line);padding-bottom:12px}
.bigday{font-family:var(--display);font-weight:800;font-size:5.4rem;line-height:.82;color:var(--accent);margin-right:14px;-webkit-flex:none;flex:none}
.tmeta{-webkit-flex:1 1 auto;flex:1 1 auto;min-width:0}
.tmeta .l1{font-size:1.45rem;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.tmeta .l2{font-size:1rem;color:var(--muted);margin-top:3px;white-space:nowrap}
.tmeta .l3{margin-top:5px}
.clock{font-family:var(--display);font-weight:600;font-size:3.2rem;line-height:.9;font-variant-numeric:tabular-nums;margin-left:10px;-webkit-flex:none;flex:none}
.hchip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.95rem;font-weight:700;margin:2px 6px 2px 0;color:#fff;background:var(--bc)}
.hchip.cn{background:var(--cn)}

.tlist{-webkit-flex:1 1 auto;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 4px}
.tall{padding:2px 0 6px}
.pill{display:inline-block;border-radius:999px;padding:5px 14px;margin:3px 8px 3px 0;font-size:1.15rem;font-weight:700;color:#fff;background:var(--c1);cursor:pointer}
.tev{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:8px 10px 8px 0;border-radius:14px;cursor:pointer;margin:2px 0}
.tev .bar{-webkit-flex:none;flex:none;width:7px;border-radius:4px;-webkit-align-self:stretch;align-self:stretch;margin-right:12px;background:var(--c1)}
.tev .tm{-webkit-flex:none;flex:none;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;min-width:2.9em}
.tev .tm small{display:block;font-family:var(--body);font-weight:400;font-size:.36em;color:var(--muted);margin-top:.35em}
.tev .tt{-webkit-flex:1 1 auto;flex:1 1 auto;min-width:0;font-weight:700;line-height:1.18;word-wrap:break-word;overflow-wrap:break-word}
.tev .tag{display:inline-block;font-size:.8rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.tev.past{opacity:.42}
.tlist.hp .tev.past{display:none}
.tev.next,.tev.cur{background:var(--tint)}
.tev.next .tag.st,.tev.cur .tag.st{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.d0 .tev{font-size:1.7rem}.d1 .tev{font-size:1.45rem}.d2 .tev{font-size:1.2rem;padding-top:5px;padding-bottom:5px}
.tnone{color:var(--muted);font-size:1.5rem;padding:22px 4px;font-weight:600}

.tbar{-webkit-flex:none;flex:none;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:6px}
.tbar .st{margin-right:auto;color:var(--muted);font-size:.8rem;padding-right:8px;min-width:0}
.tbar .btn{padding:6px 12px;font-size:.92rem}

/* ---------- photo ---------- */
.photo{position:relative;border-radius:18px;overflow:hidden;background:var(--line);height:62vw;margin-top:10px;cursor:pointer}
.pl{position:absolute;left:0;top:0;right:0;bottom:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;-webkit-transition:opacity 1.2s;transition:opacity 1.2s}
.pl.on{opacity:1}

/* ---------- strip: the following days ---------- */
.strip{margin-top:10px}
.sd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;cursor:pointer;overflow:hidden;min-width:0}
.sh{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline}
.sh .swd{font-weight:700;font-size:.95rem;white-space:nowrap}
.sh .sln{font-size:.75rem;color:var(--muted);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sh .sdn{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:.9;margin-left:auto;padding-left:4px}
.sl{font-size:.8rem;font-weight:700;color:var(--bc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.sl.cn{color:var(--cn)}
.se{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;line-height:1.3}
.se b{font-variant-numeric:tabular-nums}
.se .dot,.ev .dot,.mev .dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:4px;background:var(--c1)}
.smore{font-size:.75rem;color:var(--muted);margin-top:1px}
.sd.we .swd{color:var(--cn)}

/* ---------- month view ---------- */
#monthv{padding:12px 16px 24px;max-width:1500px;margin:0 auto}
.bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:4px 0 10px}
.bar .title{font-size:1.5rem;font-weight:800;margin-right:auto;padding-right:8px}
.mtable{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.mtable th{font-size:.95rem;color:var(--muted);font-weight:700;padding:4px 0}
.mtable td{background:var(--card);border:1px solid var(--line);border-radius:10px;vertical-align:top;padding:5px 6px;height:92px;cursor:pointer;overflow:hidden}
.mtable td.other{opacity:.45}
.mtable td.is-today{background:var(--today);border:2px solid var(--accent)}
.mtable td.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.mnum{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.mln{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mln.bc{color:var(--bc);font-weight:700}.mln.cn{color:var(--cn);font-weight:700}
.mev{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mdots{display:none}
.mdots i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:2px;background:var(--c1)}
.dlist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.dlist h3{margin:0 0 6px;font-size:1.15rem}
.hl{font-size:.95rem;font-weight:700;margin:3px 0;color:var(--bc)}
.hl.cn{color:var(--cn)}
.ev{padding:7px 4px;border-radius:8px;font-size:1.1rem;line-height:1.3;cursor:pointer}
.ev .tm{font-weight:700;margin-right:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ev .src{font-size:.75rem;color:var(--muted);margin-left:6px}
.empty{color:var(--muted);font-size:.95rem;padding:4px 2px}

/* ---------- modal ---------- */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet{background:var(--card);color:var(--ink);max-width:560px;margin:30px auto;border-radius:14px;padding:18px 18px 20px}
.sheet h2{margin:0 0 12px;font-size:1.35rem}
.fr{margin-bottom:12px}
.fr label.lb{display:block;font-weight:700;margin-bottom:4px;font-size:.95rem}
.fr input[type=text],.fr input[type=date],.fr input[type=time],.fr input[type=url],.fr select,.fr textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1rem;-webkit-appearance:none}
.row2{display:-webkit-flex;display:flex}
.row2 > div{-webkit-flex:1 1 0;flex:1 1 0;min-width:0}
.row2 > div + div{margin-left:10px}
.wds label{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:0 6px 6px 0}
.sw{display:inline-block;margin-right:8px}
.sw input{position:absolute;opacity:0}
.sw span{display:inline-block;width:30px;height:30px;border-radius:50%;border:3px solid transparent;vertical-align:middle}
.sw input:checked + span{border-color:var(--ink)}
.sw input:focus + span{outline:3px solid var(--accent)}
.acts{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:center;align-items:center;margin-top:6px}
.acts .sp{margin-right:auto}
.err{color:var(--danger);font-size:.95rem;margin-top:6px}
.hint{color:var(--muted);font-size:.88rem;line-height:1.45;margin:6px 0 0}
.kv{font-size:1.05rem;line-height:1.6}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.sec h3{margin:0 0 8px;font-size:1.05rem}
.thumbs{margin:0 -4px}
.th{display:inline-block;position:relative;width:84px;height:84px;margin:4px;border-radius:10px;background:var(--line);background-size:cover;background-position:center;vertical-align:top}
.thx{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:2px solid var(--card);background:var(--danger);color:#fff;font-weight:700;font-size:16px;line-height:1;padding:0}
.filebtn{position:relative;overflow:hidden;display:inline-block;margin-left:0}
.filebtn input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;font-size:100px;cursor:pointer}

/* ---------- tablet / fridge: one fixed screen ---------- */
@media (min-width:700px){
  html{font-size:19px}
  body.home{overflow:hidden}
  body.home #home{position:fixed;left:0;top:0;right:0;bottom:0;padding:0}
  .stage{position:absolute;left:12px;right:12px;top:12px;bottom:20%;display:-webkit-flex;display:flex}
  .today{-webkit-flex:1.75 1 0;flex:1.75 1 0;padding:18px 20px 8px}
  .photo{-webkit-flex:1 1 0;flex:1 1 0;height:auto;margin:0 0 0 10px}
  .bigday{font-size:7.2rem}
  .tmeta .l1{font-size:1.75rem}
  .tmeta .l2{font-size:1.05rem}
  .clock{font-size:4.3rem}
  .d0 .tev{font-size:2.3rem}.d1 .tev{font-size:1.85rem}.d2 .tev{font-size:1.45rem}
  .pill{font-size:1.25rem}
  .tnone{font-size:1.9rem}
  .strip{position:absolute;left:12px;right:12px;top:80%;bottom:10px;margin:0;padding-top:10px;display:-webkit-flex;display:flex}
  .sd{-webkit-flex:1 1 0;flex:1 1 0;margin:0 0 0 7px;padding:6px 8px}
  .sd:first-child{margin-left:0}
  .sh .sln{display:none}
  .se{font-size:.78rem}
}
@media (min-width:700px) and (orientation:portrait){
  .stage{-webkit-flex-direction:column;flex-direction:column}
  .today{-webkit-flex:2.2 1 0;flex:2.2 1 0;min-height:0}
  .photo{margin:10px 0 0 0}
  .bigday{font-size:8.4rem}
  .clock{font-size:5.4rem}
  .sh .sln{display:inline}
  .se{font-size:.86rem}
  .sd{padding:8px 10px}
}
/* phone */
@media (max-width:699px){
  .mtable{border-spacing:2px}
  .mtable td{height:58px;padding:3px}
  .mnum{font-size:1.15rem}
  .mev{display:none}
  .mdots{display:block;margin-top:2px}
  .bar .title{width:100%;margin-bottom:6px}
  .bar .btn{margin:3px 6px 3px 0}
  .sd{padding:10px 12px}
  .bigday{font-size:4.2rem;margin-right:10px}
  .clock{font-size:2.5rem;margin-left:6px}
  .tmeta .l1{font-size:1.15rem;overflow:hidden;text-overflow:ellipsis}
  .tmeta .l2{font-size:.85rem;overflow:hidden;text-overflow:ellipsis}
  .tbar .st{width:100%;margin-bottom:4px}
  .tbar .btn{margin:3px 6px 3px 0}
  .se{font-size:1rem;white-space:normal}
  .sl{font-size:.9rem}
}
@media (prefers-reduced-motion:reduce){*{-webkit-transition:none!important;transition:none!important}}
</style>

</div>

<div id="monthv" hidden>
  <div class="bar">
    <div class="title" id="b-title"></div>
    <button class="btn icon" id="b-prev" aria-label="上个月">‹</button>
    <button class="btn" id="b-today">本月</button>
    <button class="btn icon" id="b-next" aria-label="下个月">›</button>
    <button class="btn primary" id="b-add">＋ 添加</button>
    <button class="btn" id="b-home">返回今天</button>
  </div>
  <div id="main"></div>
</div>

function inArr(a, v){ if (!a) return false; for (var i = 0; i < a.length; i++) if (a[i] === v) return true; return false; }
function trim(s){ return String(s || '').replace(/^\s+|\s+$/g, ''); }
function isWide(){ return (window.innerWidth || document.documentElement.clientWidth) >= 700; }
function stripDays(){ return isWide() && window.innerHeight > window.innerWidth ? 4 : 7; }

/* ---------- lunar ---------- */
var lunarCache = {};
function lunarOf(d){
  var key = ymd(d); if (lunarCache[key]) return lunarCache[key];
  var y = d.getFullYear(), res = null;
  for (var ly = y; ly >= y - 1 && !res; ly--) {
    var e = LUNAR.L[ly]; if (!e) continue;
    var ny = mk(+e[0].substr(0,4), +e[0].substr(4,2) - 1, +e[0].substr(6,2));
    var off = diffDays(ny, d); if (off < 0) continue;
    var bits = e[1], leap = e[2], m = 1, isLeap = false;
    for (var k = 0; k < bits.length; k++) {
      var len = bits.charAt(k) === '1' ? 30 : 29;
      if (off < len) { res = {y: ly, m: m, d: off + 1, leap: isLeap, len: len, lastMonth: k === bits.length - 1}; break; }
      off -= len;
      if (leap && m === leap && !isLeap) isLeap = true; else { isLeap = false; m++; }
    }
  }
  lunarCache[key] = res; return res;
}
function lunarLabel(l){ if (!l) return ''; return l.d === 1 ? (l.leap ? '闰' : '') + MN[l.m] + '月' : DN[l.d]; }
function lunarFull(l){ if (!l) return ''; return '农历' + (l.leap ? '闰' : '') + MN[l.m] + '月' + DN[l.d]; }

/* ---------- holidays ---------- */
function nthWd(y, m, wd, n){ var f = mk(y, m, 1); return mk(y, m, 1 + (wd - f.getDay() + 7) % 7 + 7 * (n - 1)); }
function easter(y){
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
      i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return mk(y, mo - 1, da);
}
var holCache = {};
function holidaysOfYear(y){
  if (holCache[y]) return holCache[y];
  var H = {};
  function put(d, name, type){ var k = ymd(d); (H[k] = H[k] || []).push({name: name, type: type}); }
  put(mk(y,0,1), '元旦 New Year’s Day', 'bc');
  put(nthWd(y,1,1,3), '家庭日 Family Day', 'bc');
  put(addDays(easter(y), -2), '耶稣受难日 Good Friday', 'bc');
  var v = mk(y,4,24); put(addDays(v, -((v.getDay() + 6) % 7)), '维多利亚日 Victoria Day', 'bc');
  put(mk(y,6,1), '加拿大日 Canada Day', 'bc');
  put(nthWd(y,7,1,1), 'BC 省日 B.C. Day', 'bc');
  put(nthWd(y,8,1,1), '劳动节 Labour Day', 'bc');
  put(mk(y,8,30), '真相与和解日 Truth & Reconciliation', 'bc');
  put(nthWd(y,9,1,2), '感恩节 Thanksgiving', 'bc');
  put(mk(y,10,11), '国殇纪念日 Remembrance Day', 'bc');
  put(mk(y,11,25), '圣诞节 Christmas Day', 'bc');
  var qm = LUNAR.QM[y], dz = LUNAR.DZ[y];
  if (qm) put(mk(y, +qm.substr(0,2) - 1, +qm.substr(2,2)), '清明', 'cn');
  if (dz) put(mk(y, +dz.substr(0,2) - 1, +dz.substr(2,2)), '冬至', 'cn');
  var d = mk(y,0,1);
  while (d.getFullYear() === y) {
    var l = lunarOf(d);
    if (l && !l.leap) {
      var md = l.m * 100 + l.d;
      if (md === 101) put(d, '春节', 'cn');
      else if (md === 115) put(d, '元宵节', 'cn');
      else if (md === 505) put(d, '端午节', 'cn');
      else if (md === 707) put(d, '七夕', 'cn');
      else if (md === 815) put(d, '中秋节', 'cn');
      else if (md === 909) put(d, '重阳节', 'cn');
      else if (md === 1208) put(d, '腊八节', 'cn');
      if (l.m === 12 && l.lastMonth && l.d === l.len) put(d, '除夕', 'cn');
    }
    d = addDays(d, 1);
  }
  holCache[y] = H; return H;
}
function holidaysOn(d){ return holidaysOfYear(d.getFullYear())[ymd(d)] || []; }

/* ---------- events: merge own events + synced feeds for one day ---------- */
function occursOn(ev, d, key){
  if (!ev || !ev.date) return false;
  if (ev.repeat === 'weekly') {
    if (key < ev.date) return false;
    if (ev.until && key > ev.until) return false;
    if (inArr(ev.exdates, key)) return false;
    var days = ev.days && ev.days.length ? ev.days : [parseYmd(ev.date).getDay()];
    return inArr(days, d.getDay());
  }
  return ev.date === key;
}
function itemsOn(d){
  var key = ymd(d), out = [], id, f, i;
  for (id in S.events) if (S.events.hasOwnProperty(id)) {
    var ev = S.events[id];
    if (occursOn(ev, d, key)) out.push({id: id, title: ev.title, allDay: !!ev.allDay, start: ev.start || '', end: ev.end || '', color: ev.color || 1, weekly: ev.repeat === 'weekly', src: 'local'});
  }
  for (f = 0; f < FEEDS.length; f++) {
    var name = FEEDS[f], items = S.feeds[name].items;
    for (i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.d === key) out.push({id: 'x-' + name + '-' + i, title: it.t, allDay: !!it.ad, start: it.s || '', end: it.e || '', color: 0, src: name, loc: it.l || '', raw: it});
    }
  }
  out.sort(function(a, b){
    if (a.allDay !== b.allDay) return a.allDay ? -1 : 1;
    return a.start < b.start ? -1 : a.start > b.start ? 1 : a.title < b.title ? -1 : a.title > b.title ? 1 : 0;
  });
  return out;
}
function colClass(it){ return it.src === 'local' ? 'col' + (it.color || 1) : 'col' + it.src; }
function srcTag(it){ return it.src === 'local' ? (it.weekly ? '每周' : '') : FEEDNAME[it.src]; }
function evHtml(it, key){
  var tag = srcTag(it);
  return '<div class="ev" data-ev="' + esc(it.id) + '" data-date="' + key + '"><span class="dot ' + colClass(it) + '"></span>' +
    '<span class="tm">' + esc(it.allDay ? '全天' : it.start) + '</span>' + esc(it.title) + (tag ? '<span class="src">' + esc(tag) + '</span>' : '') + '</div>';
}

/* ---------- rendering ---------- */
var $ = function(id){ return document.getElementById(id); };
function nowStr(){ var n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()); }

function renderToday(){
  var t = today(), key = ymd(t), l = lunarOf(t), hs = holidaysOn(t), now = nowStr(), i;
  $('t-day').textContent = t.getDate();
  $('t-l1').textContent = (t.getMonth() + 1) + '月' + t.getDate() + '日 ' + WDL[t.getDay()];
  $('t-l2').textContent = lunarFull(l) + ' · ' + t.getFullYear() + '年';
  var c = '';
  for (i = 0; i < hs.length; i++) c += '<span class="hchip' + (hs[i].type === 'cn' ? ' cn' : '') + '">' + esc(hs[i].name) + '</span>';
  $('t-l3').innerHTML = c;
  $('t-clock').textContent = now;

  var items = itemsOn(t), all = '', rows = '', nTimed = 0, nextDone = false;
  for (i = 0; i < items.length; i++) {
    var it = items[i], tag = srcTag(it);
    if (it.allDay) { all += '<span class="pill ' + colClass(it) + '" data-ev="' + esc(it.id) + '" data-date="' + key + '">' + esc(it.title) + '</span>'; continue; }
    nTimed++;
    var endT = it.end || it.start, cls = '', st = '';
    if (it.start <= now && it.end && now < it.end) { cls = ' cur'; st = '进行中'; }
    else if (endT < now || (!it.end && it.start < now)) cls = ' past';
    else if (!nextDone) { cls = ' next'; st = '下一项'; nextDone = true; }
    rows += '<div class="tev' + cls + '" data-ev="' + esc(it.id) + '" data-date="' + key + '"><span class="bar ' + colClass(it) + '"></span>' +
      '<span class="tm">' + esc(it.start) + (it.end ? '<small>到 ' + esc(it.end) + '</small>' : '') + '</span>' +
      '<span class="tt">' + esc(it.title) + (st ? '<span class="tag st">' + st + '</span>' : '') + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + '</span></div>';
  }
  var h = (all ? '<div class="tall">' + all + '</div>' : '') + rows;
  if (!items.length) h = '<div class="tnone">' + (S.dbState === 'loading' ? '正在读取日程…' : '今天没有安排') + '</div>';
  var n = nTimed + (all ? 1 : 0), dens = n <= 4 ? 'd0' : n <= 6 ? 'd1' : 'd2';
  if (h !== S.listHtml) { $('t-list').innerHTML = h; S.listHtml = h; }
  var le = $('t-list'); le.className = 'tlist ' + dens;
  if (isWide()) {
    while (dens !== 'd2' && le.scrollHeight > le.clientHeight + 1) { dens = dens === 'd0' ? 'd1' : 'd2'; le.className = 'tlist ' + dens; }
    if (le.scrollHeight > le.clientHeight + 1) le.className = 'tlist d2 hp';  /* still too long: drop what is already over */
  }
  $('t-st').textContent = statusText();
  $('h-add').hidden = !S.canWrite || !S.db;
}

function statusText(){
  if (S.dbState === 'auth') return '访问令牌失效，点「设置」重新粘贴';
  if (S.dbState === 'neterr') return '暂时连不上 GitHub（' + S.dbErr + '），稍后自动重试';
  if (S.dbState === 'loading') return '正在读取…';
  var s = S.dbState === 'stale' ? '暂时无法更新（' + S.dbErr + '）' : GH.token ? '' : '只读模式，点「设置」可登录编辑';
  for (var i = 0; i < FEEDS.length; i++) {
    var f = S.feeds[FEEDS[i]];
    if (f.at) { var u = new Date(f.at); s += (s ? ' · ' : '') + FEEDNAME[FEEDS[i]] + ' ' + (u.getMonth() + 1) + '/' + u.getDate() + ' ' + pad(u.getHours()) + ':' + pad(u.getMinutes()); }
  }
  return s;
}

function renderStrip(){
  var el = $('strip'), t = today(), wide = isWide(), h = '', lines = 99;
  if (wide) { var ch = el.clientHeight || 140; lines = Math.max(1, Math.floor((ch - 10 - 14 - 32) / 20)); }
  for (var i = 0, nd = stripDays(); i < nd; i++) {
    var d = addDays(t, 1 + S.off + i), key = ymd(d), hs = holidaysOn(d), items = itemsOn(d), l = lunarOf(d);
    var label = (S.off === 0 && i === 0) ? '明天' : WD[d.getDay()];
    var showMd = d.getDate() === 1 || i === 0 || S.off !== 0;
    h += '<div class="sd' + (d.getDay() === 0 || d.getDay() === 6 ? ' we' : '') + '" data-day="' + key + '"><div class="sh"><span class="swd">' + label + '</span>' +
      '<span class="sln">' + esc(lunarLabel(l)) + '</span><span class="sdn">' + (showMd ? (d.getMonth() + 1) + '/' : '') + d.getDate() + '</span></div>';
    var left = lines, j;
    for (j = 0; j < hs.length && left > 0; j++, left--) h += '<div class="sl' + (hs[j].type === 'cn' ? ' cn' : '') + '">' + esc(hs[j].name.split(' ')[0]) + '</div>';
    var show = items.length > left ? Math.max(0, left - 1) : items.length;
    for (j = 0; j < show; j++) h += '<div class="se"><span class="dot ' + colClass(items[j]) + '"></span>' + (items[j].allDay ? '' : '<b>' + esc(items[j].start) + '</b> ') + esc(items[j].title) + '</div>';
    if (items.length > show) h += '<div class="smore">还有 ' + (items.length - show) + ' 项</div>';
    h += '</div>';
  }
  el.innerHTML = h;
}

function render(){
  if (!S.anchor) S.anchor = today();
  S.renderedDay = ymd(today());
  document.body.className = S.view === 'home' ? 'home' : 'month';
  $('home').hidden = S.view !== 'home';
  $('monthv').hidden = S.view !== 'month';
  if (S.view === 'home') { showPhoto(0); renderToday(); renderStrip(); }
  else renderMonth();
}

function renderMonth(){
  var a = S.anchor, first = mk(a.getFullYear(), a.getMonth(), 1), start = weekStartOf(first), tk = ymd(today());
  if (!S.sel || parseYmd(S.sel).getMonth() !== a.getMonth()) S.sel = (tk.substr(0,7) === ymd(first).substr(0,7)) ? tk : ymd(first);
  $('b-title').textContent = a.getFullYear() + '年' + (a.getMonth() + 1) + '月';
  $('b-add').hidden = !S.canWrite || !S.db;
  var h = '<table class="mtable"><thead><tr>', i, j, k, m;
  for (i = 0; i < 7; i++) h += '<th>' + WD[(S.settings.weekStart + i) % 7] + '</th>';
  h += '</tr></thead><tbody>';
  var d = start;
  for (var r = 0; r < 6; r++) {
    if (r === 5 && d.getMonth() !== a.getMonth()) break;
    h += '<tr>';
    for (var c = 0; c < 7; c++) {
      var key = ymd(d), hs = holidaysOn(d), items = itemsOn(d), l = lunarOf(d);
      var cls = (d.getMonth() !== a.getMonth() ? 'other ' : '') + (key === tk ? 'is-today ' : '') + (key === S.sel ? 'sel' : '');
      h += '<td class="' + cls + '" data-mday="' + key + '"><div class="mnum">' + d.getDate() + '</div>';
      if (hs.length) h += '<div class="mln ' + hs[0].type + '">' + esc(hs[0].name.split(' ')[0]) + '</div>';
      else h += '<div class="mln">' + esc(lunarLabel(l)) + '</div>';
      var dots = '';
      for (k = 0; k < items.length; k++) {
        if (k < 2) h += '<div class="mev"><span class="dot ' + colClass(items[k]) + '"></span>' + esc(items[k].allDay ? '' : items[k].start + ' ') + esc(items[k].title) + '</div>';
        if (k < 4) dots += '<i class="' + colClass(items[k]) + '"></i>';
      }
      if (items.length > 2) h += '<div class="mev" style="color:var(--muted)">还有 ' + (items.length - 2) + ' 项</div>';
      if (dots) h += '<div class="mdots">' + dots + '</div>';
      h += '</td>';
      d = addDays(d, 1);
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  var sd = parseYmd(S.sel), shs = holidaysOn(sd), sit = itemsOn(sd);
  h += '<div class="dlist"><h3>' + (sd.getMonth() + 1) + '月' + sd.getDate() + '日 ' + WDL[sd.getDay()] + ' <span style="font-weight:400;color:var(--muted);font-size:.9rem">' + esc(lunarFull(lunarOf(sd))) + '</span></h3>';
  for (j = 0; j < shs.length; j++) h += '<div class="hl' + (shs[j].type === 'cn' ? ' cn' : '') + '">' + esc(shs[j].name) + '</div>';
  for (m = 0; m < sit.length; m++) h += evHtml(sit[m], S.sel);
  if (!sit.length) h += '<div class="empty">没有安排' + (S.canWrite && S.db ? '，再点一下这一天即可添加' : '') + '</div>';
  h += '</div>';
  $('main').innerHTML = h;
}

/* ---------- modals ---------- */

function closeModal(){ $('ov').hidden = true; $('sheet').innerHTML = ''; S.modal = null; if (S.wantReload) return location.replace(S.wantReload); soon(); }
function formErr(msg){ var e = $('f-err'); if (!e) return; e.hidden = false; e.textContent = msg; }

/* one day: list + add */
function openDay(key){

  var h = '<h2>' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WDL[d.getDay()] + ' <span style="font-weight:400;color:var(--muted);font-size:.9rem">' + esc(lunarFull(lunarOf(d))) + '</span></h2><div id="dayl">';
  for (i = 0; i < hs.length; i++) h += '<div class="hl' + (hs[i].type === 'cn' ? ' cn' : '') + '">' + esc(hs[i].name) + '</div>';

function openEvent(id, key){
  if (id.indexOf('x-') === 0) { var its = itemsOn(parseYmd(key)); for (var i = 0; i < its.length; i++) if (its[i].id === id) return openFeedItem(its[i]); return; }

}
function openFeedItem(it){

}

    '<div class="fr"><label class="lb">颜色</label>';
  for (var c = 0; c < COLORS.length; c++) h += '<label class="sw"><input type="radio" name="f-color" id="f-color' + COLORS[c] + '" value="' + COLORS[c] + '"' + (((ev && ev.color) || 1) === COLORS[c] ? ' checked' : '') + '><span class="col' + COLORS[c] + '"></span></label>';
  h += '</div><div class="fr"><label class="lb" for="f-note">备注</label><textarea id="f-note" rows="2" maxlength="300">' + esc(ev ? ev.note || '' : '') + '</textarea></div>' +
    '<div class="err" id="f-err" hidden></div>' +
    '<div class="acts"><span class="sp">' + (ev ? '<button type="button" class="btn danger" id="f-del" style="margin-left:0">删除</button>' : '') + '</span>' +
    '<button type="button" class="btn" id="f-cancel">取消</button><button type="submit" class="btn primary" id="f-save">保存</button></div>' +
    '<div id="f-delbox" hidden style="margin-top:10px"></div></form>';
  showModal(h);
  S.modal = {kind: 'form', id: id, occ: dateKey};
  function sync(){ $('f-times').hidden = $('f-allday').value === '1'; $('f-weekly').hidden = $('f-repeat').value !== 'weekly'; }
  $('f-allday').onchange = sync; $('f-repeat').onchange = sync; sync();
  $('f-cancel').onclick = closeModal;
  $('f').onsubmit = function(e){ e.preventDefault(); saveForm(); };
  if (ev) $('f-del').onclick = function(){
    var b = $('f-delbox'); b.hidden = false;

try { GH.token = localStorage.getItem('cal.token') || ''; } catch (e) {}

function b64dec(s){ return decodeURIComponent(escape(atob(String(s).replace(/\s/g, '')))); }

function api(method, path, body, etag){

    x.setRequestHeader('Authorization', 'token ' + GH.token);
    x.setRequestHeader('Accept', 'application/vnd.github.v3+json');
    if (etag) x.setRequestHeader('If-None-Match', etag);

    };

}
/* No token: read the public data repo straight from raw.githubusercontent.com (no API rate limit). */
function rawGet(path){

    var x = new XMLHttpRequest();
    x.open('GET', 'https://raw.githubusercontent.com/' + GH.owner + '/' + GH.repo + '/HEAD/' + path + '?t=' + Date.now(), true);
    x.responseType = path.indexOf('.json') > 0 ? 'text' : 'blob';
    x.timeout = 60000;
    x.onload = function(){ resolve({status: x.status, body: x.response}); };
    x.onerror = x.ontimeout = function(){ reject({code: 'network'}); };
    x.send(null);
  });

function applyMain(obj){

  S.events = MAIN.events;
  var st = MAIN.settings, pm = +st.photoMin;
  S.settings = {icsUrl: st.icsUrl || '', outlookUrl: st.outlookUrl || '', weekStart: st.weekStart === 0 ? 0 : 1, photoMin: (pm === 0 || pm === 5 || pm === 15 || pm === 60) && st.photoMin != null ? pm : 1};
}
function load(name, force){

    if (r.status === 404) {
      if (!feed) { applyMain(null); return true; }
      var had = S.feeds[name].items.length > 0 || !!S.feeds[name].at;
      S.feeds[name] = {items: [], at: null}; return had;
    }
    if (r.status !== 200) throw {code: 'http' + r.status};
    if (f.etag === r.body) return false;
    f.etag = r.body;
    var obj = JSON.parse(r.body);
    if (!feed) applyMain(obj);
    else S.feeds[name] = {items: obj.items || [], at: obj.updatedAt || null};
    return true;
  });
  return api('GET', name + '.json', null, force ? null : f.etag).then(function(r){
    if (r.status === 304) return false;
    if (r.status === 404) {
      f.sha = null; f.etag = null;
      if (!feed) { applyMain(null); return true; }
      var had = S.feeds[name].items.length > 0 || !!S.feeds[name].at;
      S.feeds[name] = {items: [], at: null}; return had;
    }
    if (r.status === 401 || r.status === 403) throw {code: 'auth'};
    if (r.status !== 200 || !r.json) throw {code: 'http' + r.status};
    f.sha = r.json.sha; f.etag = r.etag;
    var obj = JSON.parse(b64dec(r.json.content));
    if (!feed) applyMain(obj);
    else S.feeds[name] = {items: obj.items || [], at: obj.updatedAt || null};
    return true;
  });
}
function feedLoad(name){ return load(name).catch(function(e){ if (e && e.code === 'auth') throw e; return false; }); }
function refresh(){

    var was = S.dbState; S.dbState = 'on'; S.db = true;
    if (ch[0] || ch[1] || ch[2] || was !== 'on') soon();
  }, function(e){
    S.dbErr = e && (e.code || e.message) || 'unknown';
    S.dbState = e && e.code === 'auth' ? 'auth' : S.db ? 'stale' : 'neterr'; soon();

/* Read latest, change it, write back. Retries if another device saved in between. */
function mutate(fn, tries){
  tries = tries || 0;
  return load('main', true).then(function(){
    var copy = JSON.parse(JSON.stringify(MAIN));
    fn(copy);
    var body = {message: 'calendar update', content: b64enc(JSON.stringify(copy, null, 1))};
    if (FILES.main.sha) body.sha = FILES.main.sha;
    return api('PUT', 'main.json', body).then(function(r){
      if ((r.status === 409 || r.status === 422) && tries < 2) return mutate(fn, tries + 1);
      if (r.status === 401 || r.status === 403 || r.status === 404) throw {code: 'auth'};
      if (r.status !== 200 && r.status !== 201) throw {code: 'http' + r.status};
      FILES.main.sha = r.json.content.sha; FILES.main.etag = null;

function newId(p){ return (p || 'e') + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
var Store = {
  put: function(id, obj){ return mutate(function(d){ d.events[id || newId()] = obj; }); },
  del: function(id){ return mutate(function(d){ delete d.events[id]; }); },
  exclude: function(id, key){ return mutate(function(d){ var e = d.events[id]; if (!e) return; e.exdates = (e.exdates || []).concat([key]); }); },
  settings: function(s){ return mutate(function(d){ var k; d.settings = d.settings || {}; for (k in s) if (s.hasOwnProperty(k)) d.settings[k] = s[k]; }); }
};

var MAXPH = 30;

function photos(){ return MAIN.photos || []; }
function loadPhoto(p){

    if (r.status !== 200) throw {code: 'http' + r.status};

      var fr = new FileReader();

  var p = list[PH.idx];

/* Shrink in the browser so each photo stays well under GitHub's 1 MB inline limit. */
function shrink(file){

    var U = window.URL || window.webkitURL, url = U.createObjectURL(file), img = new Image();

function phMsg(t){ var m = $('s-phmsg'); if (m) m.textContent = t; }
function uploadPhotos(files){
  var room = MAXPH - photos().length, added = [], failed = 0, i = 0;

  if (files.length > room) files = files.slice(0, room);
  S.busy = true;
  function next(){
    if (i >= files.length) return finish();
    phMsg('正在上传 ' + (i + 1) + ' / ' + files.length + ' …请不要关闭');
    var id = newId('p'), path = 'photos/' + id + '.jpg';

  for (i = 0; i < list.length; i++) if (list[i].id === id) p = list[i];
  if (!p || S.busy) return;
  if (window.confirm && !window.confirm('删除这张照片？')) return;
  S.busy = true; phMsg('正在删除…');
  api('DELETE', p.path, {message: 'remove photo', sha: p.sha}).then(function(r){
    if (r.status === 401 || r.status === 403) throw {code: 'auth'};
    return mutate(function(d){ var out = [], a = d.photos || []; for (var j = 0; j < a.length; j++) if (a[j].id !== id) out.push(a[j]); d.photos = out; });
  }).then(function(){ S.busy = false; delete PH.cache[id]; PH.shown = null; phMsg('已删除。'); renderThumbs(); showPhoto(0); },
    function(e){ S.busy = false; phMsg(writeErrText(e)); });
}
function renderThumbs(){
  var box = $('s-thumbs'); if (!box) return;
  var list = photos(), h = '', i = 0;
  for (var k = 0; k < list.length; k++) h += '<div class="th" id="th-' + esc(list[k].id) + '"><button type="button" class="thx" data-del="' + esc(list[k].id) + '" aria-label="删除照片">×</button></div>';
  box.innerHTML = h || '<span class="hint" style="margin-left:4px">还没有照片。</span>';
  function one(){
    if (i >= list.length || !$('s-thumbs')) return;
    var p = list[i++];
    loadPhoto(p).then(function(u){ var el = $('th-' + p.id); if (el) el.style.backgroundImage = 'url(' + u + ')'; one(); }, one);
  }
  one();
}

/* ---------- token ---------- */
function openTokenSetup(msg){
  showModal('<h2>登录以编辑</h2><form id="tk" autocomplete="off">' +
    (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
    '<div class="fr"><label class="lb" for="tk-in">GitHub 访问令牌</label><input type="text" id="tk-in" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…" value=""></div>' +
    '<p class="hint">查看日程不需要令牌；只有添加、修改日程和上传照片才要。每台设备只需要粘贴一次，会保存在这台设备上。令牌只用来写入数据仓库 ' + esc(GH.owner) + '/' + esc(GH.repo) + '。</p>' +
    '<div class="err" id="f-err" hidden></div>' +
    '<div class="acts"><span class="sp"></span><button type="button" class="btn" id="tk-skip">先不连接</button><button type="submit" class="btn primary" id="f-save">连接</button></div></form>');
  S.modal = {kind: 'token'};
  $('tk-skip').onclick = closeModal;
  $('tk').onsubmit = function(e){
    e.preventDefault();
    var t = $('tk-in').value.replace(/\s/g, '');
    if (!/^(github_pat_|ghp_)/.test(t)) return formErr('令牌应以 github_pat_ 开头，请检查是否复制完整。');
    GH.token = t; var btn = $('f-save'); btn.disabled = true; btn.textContent = '连接中…';
    load('main', true).then(function(){
      try { localStorage.setItem('cal.token', t); } catch (er) {}
      S.dbState = 'on'; S.db = true; S.canWrite = true; closeModal(); refresh(); render();
    }, function(er){
      GH.token = ''; S.canWrite = false; btn.disabled = false; btn.textContent = '连接';
      formErr(er && er.code === 'auth' ? '令牌无效或没有访问权限。' : '连接失败，请检查网络后重试。');
    });
  };
}

/* ---------- self-update: a page left open on the fridge reloads itself when a new version is published ---------- */
function checkUpdate(){
  if (!/^https?:$/.test(location.protocol) || !BUILD) return;
  var x = new XMLHttpRequest();
  x.open('GET', location.pathname + '?v=' + Date.now(), true);
  x.onload = function(){
    var m = /name="build" content="([^"]+)"/.exec(x.responseText || '');
    if (x.status !== 200 || !m || m[1] === BUILD) return;
    var url = location.pathname + '?v=' + encodeURIComponent(m[1]);
    if (S.modal || S.busy) S.wantReload = url; else location.replace(url);
  };
  x.send(null);
}

S.anchor = today();
S.dbState = 'loading';
S.canWrite = !!GH.token;
render();
refresh();
setInterval(function(){ if (!S.modal) refresh(); }, 60000);
setInterval(checkUpdate, 600000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { refresh(); checkUpdate(); } }, false);
})();
</script>

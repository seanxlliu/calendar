<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家庭日历">
<link rel="apple-touch-icon" href="icon.png">
<title>冰箱家庭日历</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: fridge board — oversized "today" strip on top, seven equal day columns below; stacks to a list on phones. */
:root{
  --bg:#eef2f3; --card:#ffffff; --ink:#132029; --muted:#5a6873; --line:#d5dde1;
  --accent:#1f4f86; --accent-ink:#ffffff; --today:#fff6d6;
  --bc:#0b7563; --cn:#c2372a;
  --c1:#1f6fd1; --c2:#13915c; --c3:#e07a12; --c4:#7d4cc9; --c5:#d23c6f;
  --danger:#b3261e;
  --display:"Big Shoulders Display","Avenir Next Condensed","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans GB","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --card:#172026; --ink:#eef3f5; --muted:#9db0bb; --line:#2a3740;
  --accent:#8bbcf0; --accent-ink:#0e1418; --today:#2b2a1a;
  --bc:#4fcab2; --cn:#ff7c68;
  --c1:#6aa8f5; --c2:#4cc98d; --c3:#f3a04b; --c4:#b394f0; --c5:#f27aa1; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --card:#172026; --ink:#eef3f5; --muted:#9db0bb; --line:#2a3740;
  --accent:#8bbcf0; --accent-ink:#0e1418; --today:#2b2a1a;
  --bc:#4fcab2; --cn:#ff7c68;
  --c1:#6aa8f5; --c2:#4cc98d; --c3:#f3a04b; --c4:#b394f0; --c5:#f27aa1; --danger:#ff8a80; color-scheme:dark}

html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:#eef2f3;background:var(--bg);color:#132029;color:var(--ink);font-family:var(--body);margin:0}
.wrap{padding:12px 16px 24px 16px;max-width:1500px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;border-radius:10px}
button:focus,input:focus,select:focus,textarea:focus{outline:3px solid var(--accent);outline-offset:1px}

/* Today strip */
.top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.bigday{font-family:var(--display);font-weight:800;font-size:5.2rem;line-height:.85;margin-right:14px;color:var(--accent)}
.daymeta{-webkit-flex:1 1 auto;flex:1 1 auto;min-width:0}
.daymeta .l1{font-size:1.5rem;font-weight:700;letter-spacing:.02em}
.daymeta .l2{font-size:1.05rem;color:var(--muted);margin-top:4px}
.daymeta .l3{margin-top:6px;font-size:1.05rem}
.clock{font-family:var(--display);font-weight:600;font-size:4.2rem;line-height:.9;font-variant-numeric:tabular-nums;margin-left:12px}
.hchip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.95rem;font-weight:700;margin:2px 6px 2px 0;color:#fff;background:var(--bc)}
.hchip.cn{background:var(--cn)}

.bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:14px 0 12px}
.bar .title{font-size:1.25rem;font-weight:700;margin-right:auto;padding-right:8px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;margin:3px 0 3px 6px;font-size:1rem;line-height:1.2}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.icon{padding:8px 12px;font-weight:700}

.notice{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;color:var(--muted);font-size:.95rem}

/* Week */
.week{display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch}
.day{-webkit-flex:1 1 0;flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 14px;margin-left:8px;min-height:340px;cursor:pointer}
.day:first-child{margin-left:0}
.day.is-today{background:var(--today);border:2px solid var(--accent)}
.day.past{opacity:.62}
.dh{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.dh .wd{font-weight:700;font-size:1.05rem}
.dh .dn{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:1;margin-left:auto}
.dh .ln{font-size:.85rem;color:var(--muted);margin-left:6px}
.hl{font-size:.9rem;font-weight:700;margin:3px 0;color:var(--bc)}
.hl.cn{color:var(--cn)}
.ev{display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start;padding:5px 2px;border-radius:8px;font-size:1.05rem;line-height:1.3}
.ev .dot{-webkit-flex:none;flex:none;width:.7em;height:.7em;border-radius:50%;margin:.33em 6px 0 0;background:var(--c1)}
.ev .tm{font-weight:700;margin-right:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ev .tx{min-width:0;word-wrap:break-word;overflow-wrap:break-word}
.ev .src{font-size:.75rem;color:var(--muted);margin-left:4px}
.ev:hover{background:rgba(127,127,127,.12)}
.empty{color:var(--muted);font-size:.9rem;padding:4px 2px}
.col1{background:var(--c1)!important}.col2{background:var(--c2)!important}.col3{background:var(--c3)!important}.col4{background:var(--c4)!important}.col5{background:var(--c5)!important}

/* Month */
.mtable{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.mtable th{font-size:.95rem;color:var(--muted);font-weight:700;padding:4px 0}
.mtable td{background:var(--card);border:1px solid var(--line);border-radius:10px;vertical-align:top;padding:5px 6px;height:98px;cursor:pointer;overflow:hidden}
.mtable td.other{opacity:.45}
.mtable td.is-today{background:var(--today);border:2px solid var(--accent)}
.mtable td.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.mnum{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.mln{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mln.bc{color:var(--bc);font-weight:700}.mln.cn{color:var(--cn);font-weight:700}
.mev{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mev .dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-right:3px;background:var(--c1)}
.dlist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.dlist h3{margin:0 0 6px;font-size:1.15rem}

.foot{margin-top:14px;font-size:.85rem;color:var(--muted)}

/* Modal */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet{background:var(--card);color:var(--ink);max-width:560px;margin:30px auto;border-radius:14px;padding:18px 18px 20px}
.sheet h2{margin:0 0 12px;font-size:1.35rem}
.fr{margin-bottom:12px}
.fr label.lb{display:block;font-weight:700;margin-bottom:4px;font-size:.95rem}
.fr input[type=text],.fr input[type=date],.fr input[type=time],.fr input[type=url],.fr select,.fr textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1rem;-webkit-appearance:none}
.row2{display:-webkit-flex;display:flex}
.row2 > div{-webkit-flex:1 1 0;flex:1 1 0;min-width:0}
.row2 > div + div{margin-left:10px}
.wds label{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:0 6px 6px 0}
.sw{display:inline-block;margin-right:8px}
.sw input{position:absolute;opacity:0}
.sw span{display:inline-block;width:30px;height:30px;border-radius:50%;border:3px solid transparent;vertical-align:middle}
.sw input:checked + span{border-color:var(--ink)}
.sw input:focus + span{outline:3px solid var(--accent)}
.acts{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:center;align-items:center;margin-top:6px}
.acts .sp{margin-right:auto}
.err{color:var(--danger);font-size:.95rem;margin-top:6px}
.hint{color:var(--muted);font-size:.88rem;line-height:1.45}
.kv{font-size:1.05rem;line-height:1.6}

/* Tablet / fridge: bigger everything */
@media (min-width:700px){
  html{font-size:19px}
  .bigday{font-size:6.4rem}
  .clock{font-size:5.4rem}
}
@media (min-width:700px) and (max-width:1180px){
  .day{padding:8px 6px 12px;margin-left:5px}
  .dh{display:block;text-align:center}
  .dh .dn{display:block;font-size:2.4rem;margin:2px 0}
  .dh .ln{display:block;margin:0}
  .ev{font-size:.95rem;display:block}
  .ev .dot{display:inline-block;vertical-align:middle;margin:0 4px 0 0}
  .ev .tm{display:inline}
  .ev .tx{display:inline}
}
/* Phone */
@media (max-width:699px){
  .bigday{font-size:4rem}
  .clock{font-size:2.6rem;margin-left:auto}
  .daymeta .l1{font-size:1.2rem}
  .week{display:block}
  .day{margin:0 0 8px 0;min-height:0}
  .day.past{display:none}
  .mtable{border-spacing:2px}
  .mtable td{height:58px;padding:3px}
  .mnum{font-size:1.15rem}
  .mev{display:none}
  .mdots{display:block!important;margin-top:2px}
  .bar .title{width:100%;margin-bottom:6px}
  .btn{margin:3px 6px 3px 0}
}
.mdots{display:none}
.mdots i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:2px;background:var(--c1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<div class="wrap">
  <div class="top">
    <div class="bigday" id="t-day">–</div>
    <div class="daymeta">
      <div class="l1" id="t-l1"></div>
      <div class="l2" id="t-l2"></div>
      <div class="l3" id="t-l3"></div>
    </div>
    <div class="clock" id="t-clock">--:--</div>
  </div>

  <div class="bar">
    <div class="title" id="b-title"></div>
    <button class="btn icon" id="b-prev" aria-label="上一页">‹</button>
    <button class="btn" id="b-today">今天</button>
    <button class="btn icon" id="b-next" aria-label="下一页">›</button>
    <button class="btn" id="b-week">本周</button>
    <button class="btn" id="b-month">月</button>
    <button class="btn primary" id="b-add">＋ 添加</button>
    <button class="btn" id="b-set" aria-label="设置">设置</button>
  </div>

  <div class="notice" id="notice" hidden></div>
  <div id="main"></div>
  <div class="foot" id="foot"></div>
</div>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>

<script>

function pad(n){ return (n < 10 ? '0' : '') + n; }

      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
      i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),

var holCache = {};

  var v = mk(y,4,24); put(addDays(v, -((v.getDay() + 6) % 7)), '维多利亚日 Victoria Day', 'bc');

  put(nthWd(y,8,1,1), '劳动节 Labour Day', 'bc');

/* ---------- rendering ---------- */
var $ = function(id){ return document.getElementById(id); };
function renderTop(){
  var n = new Date(), t = today(), l = lunarOf(t), hs = holidaysOn(t);
  $('t-day').textContent = t.getDate();
  $('t-l1').textContent = (t.getMonth() + 1) + '月' + t.getDate() + '日 ' + WDL[t.getDay()];
  $('t-l2').textContent = lunarFull(l) + '  ·  ' + t.getFullYear() + '年';
  var h = '';
  for (var i = 0; i < hs.length; i++) h += '<span class="hchip' + (hs[i].type === 'cn' ? ' cn' : '') + '">' + esc(hs[i].name) + '</span>';
  var items = itemsOn(t), nowStr = pad(n.getHours()) + ':' + pad(n.getMinutes()), next = null;
  for (var j = 0; j < items.length; j++) if (!items[j].allDay && items[j].start >= nowStr) { next = items[j]; break; }
  if (next) h += '<span>下一项：<b>' + esc(next.start) + '</b> ' + esc(next.title) + '</span>';
  else if (!hs.length) h += '<span style="color:var(--muted)">' + (items.length ? '今天的安排已全部结束' : '今天没有安排') + '</span>';
  $('t-l3').innerHTML = h;
  $('t-clock').textContent = nowStr;
}

function render(){
  if (!S.anchor) S.anchor = today();
  S.renderedDay = ymd(today());
  renderTop();
  $('b-week').className = 'btn' + (S.view === 'week' ? ' on' : '');
  $('b-month').className = 'btn' + (S.view === 'month' ? ' on' : '');
  $('b-add').hidden = !S.canWrite || !S.db;
  if (S.view === 'week') renderWeek(); else renderMonth();
  renderNotice();
}

function renderWeek(){
  var ws = weekStartOf(S.anchor), t = today(), tk = ymd(t), h = '<div class="week">';
  var we = addDays(ws, 6);
  $('b-title').textContent = (ws.getMonth() + 1) + '月' + ws.getDate() + '日 – ' + (we.getMonth() !== ws.getMonth() ? (we.getMonth() + 1) + '月' : '') + we.getDate() + '日';
  for (var i = 0; i < 7; i++) {
    var d = addDays(ws, i), key = ymd(d), l = lunarOf(d), hs = holidaysOn(d), items = itemsOn(d);
    var cls = 'day' + (key === tk ? ' is-today' : key < tk ? ' past' : '');
    h += '<div class="' + cls + '" data-day="' + key + '"><div class="dh"><span class="wd">' + (key === tk ? '今天' : WD[d.getDay()]) + '</span>' +
      '<span class="ln">' + esc(lunarLabel(l)) + '</span><span class="dn">' + d.getDate() + '</span></div>';
    for (var j = 0; j < hs.length; j++) h += '<div class="hl' + (hs[j].type === 'cn' ? ' cn' : '') + '">' + esc(hs[j].name) + '</div>';
    for (var k = 0; k < items.length; k++) h += evHtml(items[k], key);
    if (!items.length && !hs.length) h += '<div class="empty">—</div>';
    h += '</div>';
  }
  $('main').innerHTML = h + '</div>';
}

function renderMonth(){
  var a = S.anchor, first = mk(a.getFullYear(), a.getMonth(), 1), start = weekStartOf(first), tk = ymd(today());
  if (!S.sel || parseYmd(S.sel).getMonth() !== a.getMonth()) S.sel = (ymd(today()).substr(0,7) === ymd(first).substr(0,7)) ? tk : ymd(first);
  $('b-title').textContent = a.getFullYear() + '年' + (a.getMonth() + 1) + '月';
  var h = '<div style="overflow-x:auto"><table class="mtable"><thead><tr>';
  for (var i = 0; i < 7; i++) h += '<th>' + WD[(S.settings.weekStart + i) % 7] + '</th>';
  h += '</tr></thead><tbody>';
  var d = start;
  for (var r = 0; r < 6; r++) {
    if (r === 5 && d.getMonth() !== a.getMonth()) break;
    h += '<tr>';
    for (var c = 0; c < 7; c++) {
      var key = ymd(d), hs = holidaysOn(d), items = itemsOn(d), l = lunarOf(d);
      var cls = (d.getMonth() !== a.getMonth() ? 'other ' : '') + (key === tk ? 'is-today ' : '') + (key === S.sel ? 'sel' : '');
      h += '<td class="' + cls + '" data-mday="' + key + '"><div class="mnum">' + d.getDate() + '</div>';
      if (hs.length) h += '<div class="mln ' + hs[0].type + '">' + esc(hs[0].name.split(' ')[0]) + '</div>';
      else h += '<div class="mln">' + esc(lunarLabel(l)) + '</div>';
      var shown = 0, dots = '';
      for (var k = 0; k < items.length; k++) {
        if (shown < 3) { h += '<div class="mev"><span class="dot' + dotClass(items[k]) + '"' + (items[k].src === 'icloud' ? ' style="background:var(--muted)"' : '') + '></span>' + esc(items[k].allDay ? '' : items[k].start + ' ') + esc(items[k].title) + '</div>'; shown++; }
        if (k < 4) dots += '<i class="' + dotClass(items[k]).replace(' ', '') + '"></i>';
      }
      if (items.length > 3) h += '<div class="mev" style="color:var(--muted)">还有 ' + (items.length - 3) + ' 项</div>';
      if (dots) h += '<div class="mdots">' + dots + '</div>';
      h += '</td>';
      d = addDays(d, 1);
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  // selected day list
  var sd = parseYmd(S.sel), sl = lunarOf(sd), shs = holidaysOn(sd), sit = itemsOn(sd);
  h += '<div class="dlist"><h3>' + (sd.getMonth() + 1) + '月' + sd.getDate() + '日 ' + WDL[sd.getDay()] + ' <span style="font-weight:400;color:var(--muted);font-size:.9rem">' + esc(lunarFull(sl)) + '</span></h3>';
  for (var j = 0; j < shs.length; j++) h += '<div class="hl' + (shs[j].type === 'cn' ? ' cn' : '') + '">' + esc(shs[j].name) + '</div>';
  for (var m = 0; m < sit.length; m++) h += evHtml(sit[m], S.sel);
  if (!sit.length) h += '<div class="empty">没有安排' + (S.canWrite && S.db ? '，点「＋ 添加」新建' : '') + '</div>';
  h += '</div>';
  $('main').innerHTML = h;
}

function renderNotice(){

  h += '</div><label class="lb" for="f-until" style="margin-top:6px">结束于（可不填）</label><input type="date" id="f-until" value="' + esc(ev && ev.until || '') + '"></div>' +

    '<div class="err" id="f-err" hidden></div>' +

    var b = $('f-delbox'); b.hidden = false;

function formErr(msg){ var e = $('f-err'); e.hidden = false; e.textContent = msg; }
function saveForm(){
  var title = $('f-title').value.replace(/^\s+|\s+$/g, ''), date = $('f-date').value;
  if (!title) return formErr('请填写标题。');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return formErr('请选择日期。');
  var allDay = $('f-allday').value === '1', start = $('f-start').value, end = $('f-end').value;
  if (!allDay && !start) return formErr('请填写开始时间，或改为「全天」。');
  if (!allDay && end && end < start) return formErr('结束时间早于开始时间。');
  var repeat = $('f-repeat').value, days = [];
  if (repeat === 'weekly') { for (var i = 0; i < 7; i++) if ($('f-wd' + i).checked) days.push(i); if (!days.length) return formErr('请至少选择一天。'); }
  var until = repeat === 'weekly' ? $('f-until').value : '';
  if (until && until < date) return formErr('结束日期早于开始日期。');
  var color = 1; for (var c = 1; c <= 5; c++) if ($('f-color' + c).checked) color = c;
  var old = S.modal.id ? S.events[S.modal.id] : null;
  var obj = {title: title, date: date, allDay: allDay, start: allDay ? '' : start, end: allDay ? '' : end, repeat: repeat, days: days, until: until || '', color: color, note: $('f-note').value, exdates: old && old.exdates && repeat === 'weekly' ? old.exdates : [], updatedAt: new Date().toISOString()};
  var id = S.modal.id;
  doWrite(function(){ return Store.put(id, obj); });
}
function doWrite(fn){
  var btn = $('f-save'); if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
  fn().then(function(){ closeModal(); }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '保存'; }
    if (e && e.code === 'auth') S.dbState = 'auth';
    formErr(e && e.code === 'quota_exceeded' ? '数据库已满，请删除一些旧日程后再试。' : e && e.code === 'auth' ? '令牌没有写入权限，请在设置里重新连接。' : '保存失败，请检查网络后重试。');
  });
}

/* ---------- interactions ---------- */
function findAttr(el, name){ while (el && el !== document) { if (el.getAttribute && el.getAttribute(name) != null) return el; el = el.parentNode; } return null; }
$('main').onclick = function(e){
  var evEl = findAttr(e.target, 'data-ev');
  if (evEl) {
    var id = evEl.getAttribute('data-ev'), key = evEl.getAttribute('data-date');
    if (id.indexOf('ic') === 0) { var its = itemsOn(parseYmd(key)); for (var i = 0; i < its.length; i++) if (its[i].id === id) return openIcloud(its[i]); }
    return openForm(id, key);
  }
  var md = findAttr(e.target, 'data-mday');
  if (md) { var k = md.getAttribute('data-mday'); if (S.sel === k && S.canWrite && S.db) return openForm(null, k); S.sel = k; if (parseYmd(k).getMonth() !== S.anchor.getMonth()) S.anchor = parseYmd(k); return renderMonth(); }
  var dd = findAttr(e.target, 'data-day');
  if (dd && S.canWrite && S.db) openForm(null, dd.getAttribute('data-day'));
};
$('ov').onclick = function(e){ if (e.target === $('ov')) closeModal(); };
document.onkeydown = function(e){ if ((e.key === 'Escape' || e.keyCode === 27) && S.modal) closeModal(); };
function setView(v){ S.view = v; try { localStorage.setItem('cal.view', v); } catch (e) {} render(); }
$('b-week').onclick = function(){ setView('week'); };
$('b-month').onclick = function(){ setView('month'); };
$('b-today').onclick = function(){ S.anchor = today(); S.sel = null; render(); };
function step(n){
  var a = S.anchor;
  if (S.view === 'week') S.anchor = addDays(a, 7 * n);
  else { S.anchor = mk(a.getFullYear(), a.getMonth() + n, 1); S.sel = null; }
  render();
}
$('b-prev').onclick = function(){ step(-1); };
$('b-next').onclick = function(){ step(1); };
$('b-add').onclick = function(){ openForm(null, S.view === 'month' ? S.sel : ymd(today())); };
$('b-set').onclick = openSettings;
function touched(){ S.lastTouch = Date.now(); }
document.addEventListener('touchstart', touched, false);
document.addEventListener('mousedown', touched, false);
document.addEventListener('keydown', touched, false);

/* clock + idle return-to-today (for the fridge) */
setInterval(function(){
  if (ymd(today()) !== S.renderedDay) { if (!S.modal) { S.anchor = today(); render(); } }
  else renderTop();
  if (!S.modal && Date.now() - S.lastTouch > 180000) {
    var ws = ymd(weekStartOf(today()));
    if (S.view === 'week' && ymd(weekStartOf(S.anchor)) !== ws) { S.anchor = today(); render(); }
  }
}, 15000);

/* ---------- data: GitHub private repo as the store ---------- */
var GH = { owner: /\.github\.io$/i.test(location.hostname) ? location.hostname.split('.')[0] : 'seanxlliu', repo: 'calendar-data', token: '' };
try { GH.token = localStorage.getItem('cal.token') || ''; } catch (e) {}
var FILES = { main: {sha: null, etag: null}, icloud: {sha: null, etag: null} };
var MAIN = { events: {}, settings: {weekStart: 1, icsUrl: ''} };
var rerenderTimer = null;
function soon(){ if (rerenderTimer) return; rerenderTimer = setTimeout(function(){ rerenderTimer = null; if (S.modal && S.modal.kind !== 'info') { renderTop(); renderNotice(); return; } render(); }, 60); }

function b64dec(s){ return decodeURIComponent(escape(atob(String(s).replace(/\s/g, '')))); }
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function api(method, path, body, etag){
  return new Promise(function(resolve, reject){
    var x = new XMLHttpRequest();
    var url = 'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + path + (method === 'GET' ? '?t=' + Date.now() : '');
    x.open(method, url, true);
    x.setRequestHeader('Authorization', 'token ' + GH.token);
    x.setRequestHeader('Accept', 'application/vnd.github.v3+json');
    if (etag) x.setRequestHeader('If-None-Match', etag);
    if (body) x.setRequestHeader('Content-Type', 'application/json');
    x.timeout = 30000;
    x.onload = function(){
      var j = null; try { j = JSON.parse(x.responseText); } catch (e) {}
      resolve({status: x.status, json: j, etag: x.getResponseHeader('ETag')});
    };
    x.onerror = x.ontimeout = function(){ reject({code: 'network'}); };
    x.send(body ? JSON.stringify(body) : null);
  });
}
function applyMain(obj){
  MAIN = obj || {};
  if (!MAIN.events) MAIN.events = {};
  if (!MAIN.settings) MAIN.settings = {};
  S.events = MAIN.events;
  S.settings = {icsUrl: MAIN.settings.icsUrl || '', weekStart: MAIN.settings.weekStart === 0 ? 0 : 1};
}
function load(name, force){
  var f = FILES[name];
  return api('GET', name + '.json', null, force ? null : f.etag).then(function(r){
    if (r.status === 304) return false;
    if (r.status === 404) { f.sha = null; return name === 'main' ? (applyMain(null), true) : false; }
    if (r.status === 401 || r.status === 403) throw {code: 'auth'};
    if (r.status !== 200 || !r.json) throw {code: 'http' + r.status};
    f.sha = r.json.sha; f.etag = r.etag;
    var obj = JSON.parse(b64dec(r.json.content));
    if (name === 'main') applyMain(obj);
    else { S.icloud = obj.items || []; S.icloudAt = obj.updatedAt || null; }
    return true;
  });
}
function refresh(){
  if (!GH.token) return;
  Promise.all([load('main'), load('icloud').catch(function(e){ if (e && e.code === 'auth') throw e; return false; })]).then(function(ch){
    var was = S.dbState; S.dbState = 'on'; S.db = true;
    if (ch[0] || ch[1] || was !== 'on') soon();
  }, function(e){
    S.dbState = e && e.code === 'auth' ? 'auth' : S.db ? 'stale' : 'neterr'; soon();
  });
}
/* Read latest, change it, write back. Retries once if someone else saved in between. */
function mutate(fn, tries){
  tries = tries || 0;
  return load('main', true).then(function(){
    var copy = JSON.parse(JSON.stringify(MAIN));
    fn(copy);
    var body = {message: 'calendar update', content: b64enc(JSON.stringify(copy, null, 1))};
    if (FILES.main.sha) body.sha = FILES.main.sha;
    return api('PUT', 'main.json', body).then(function(r){
      if ((r.status === 409 || r.status === 422) && tries < 2) return mutate(fn, tries + 1);
      if (r.status === 401 || r.status === 403 || r.status === 404) throw {code: 'auth'};
      if (r.status !== 200 && r.status !== 201) throw {code: 'http' + r.status};
      FILES.main.sha = r.json.content.sha; FILES.main.etag = null;
      applyMain(copy); soon();
    });
  });
}
function newId(){ return 'e' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
var Store = {
  put: function(id, obj){ return mutate(function(d){ d.events[id || newId()] = obj; }); },
  del: function(id){ return mutate(function(d){ delete d.events[id]; }); },
  exclude: function(id, key){ return mutate(function(d){ var e = d.events[id]; if (!e) return; e.exdates = (e.exdates || []).concat([key]); }); },
  settings: function(s){ return mutate(function(d){ d.settings = s; }); }
};

function openTokenSetup(msg){
  showModal('<h2>连接日程数据</h2><form id="tk" autocomplete="off">' +
    (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
    '<div class="fr"><label class="lb" for="tk-in">GitHub 访问令牌</label><input type="text" id="tk-in" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…" value=""></div>' +
    '<p class="hint">每台设备只需要粘贴一次，会保存在这台设备上。令牌只用来读写你的私有仓库 ' + esc(GH.owner) + '/' + esc(GH.repo) + '。</p>' +
    '<div class="err" id="f-err" hidden></div>' +
    '<div class="acts"><span class="sp"></span><button type="button" class="btn" id="tk-skip">先不连接</button><button type="submit" class="btn primary" id="f-save">连接</button></div></form>');
  S.modal = {kind: 'token'};
  $('tk-skip').onclick = closeModal;
  $('tk').onsubmit = function(e){
    e.preventDefault();
    var t = $('tk-in').value.replace(/\s/g, '');
    if (!/^(github_pat_|ghp_)/.test(t)) return formErr('令牌应以 github_pat_ 开头，请检查是否复制完整。');
    GH.token = t; var btn = $('f-save'); btn.disabled = true; btn.textContent = '连接中…';
    load('main', true).then(function(){
      try { localStorage.setItem('cal.token', t); } catch (er) {}
      S.dbState = 'on'; S.db = true; closeModal(); refresh(); render();
    }, function(er){
      GH.token = ''; btn.disabled = false; btn.textContent = '连接';
      formErr(er && er.code === 'auth' ? '令牌无效或没有访问权限。' : '连接失败，请检查网络后重试。');
    });
  };
}

S.anchor = today();
if (GH.token) S.dbState = 'loading'; else S.dbState = 'notoken';
render();
if (GH.token) refresh(); else openTokenSetup('');
setInterval(function(){ if (!S.modal) refresh(); }, 60000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh(); }, false);
})();
</script>
